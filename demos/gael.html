<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gael Live Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --ground:#eef2f7; --app:#f5f5f7; --card:#ffffff; --ink:#111111; --ink2:rgba(0,0,0,0.7);
  --mut:rgba(0,0,0,0.55); --faint:rgba(0,0,0,0.5); --line:rgba(0,0,0,0.07); --line2:rgba(0,0,0,0.05);
  --blue:#2563eb; --blue-soft:rgba(37,99,235,0.07); --field:#f0f4f8; --thead:#f9fafb;
  --green:#047857; --red:#dc2626; --amber:#b45309;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
button,input,select{font-family:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{height:100%;padding:16px;display:flex;align-items:center;justify-content:center}
.app{display:flex;width:100%;max-width:1200px;height:100%;max-height:880px;border-radius:14px;overflow:hidden;background:var(--app);border:1px solid rgba(15,23,42,0.10);box-shadow:0 40px 80px -40px rgba(30,58,138,0.40),0 14px 30px -18px rgba(15,23,42,0.18)}

/* sidebar */
.side{width:224px;flex-shrink:0;background:var(--card);border-right:1px solid rgba(0,0,0,0.08);display:flex;flex-direction:column}
.lights{height:52px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 18px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.brand{padding:0 20px 20px}
.brand-row{display:flex;align-items:center;gap:10px}
.brand-row img{width:32px;height:32px;border-radius:7px;display:block}
.bn{font-size:16px;font-weight:600;letter-spacing:-0.2px;line-height:1}
.bs{font-size:10px;color:var(--faint);margin-top:3px;letter-spacing:0.1em;text-transform:uppercase}
.ctl{margin-top:16px;display:flex;gap:6px;align-items:center}
.seg{flex:1;display:flex;background:var(--field);border-radius:8px;padding:3px;gap:2px}
.seg button{flex:1;padding:5px 10px;border-radius:6px;border:none;font-size:11px;font-weight:700;letter-spacing:0.04em;transition:all .15s}
.eye{flex-shrink:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:none;transition:all .15s}
.menu-lbl{padding:0 20px 8px;font-size:9.5px;color:var(--faint);font-weight:500;letter-spacing:0.12em;text-transform:uppercase}
.nav{flex:1;padding:0 8px 12px;display:flex;flex-direction:column;gap:1px}
.nav-i{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:5px;border:none;border-left:2px solid transparent;font-size:13px;letter-spacing:0.01em;text-align:left;transition:all .15s;white-space:nowrap}
.nav-i:hover{color:#1f2937!important}
.side-foot{padding:16px 20px;border-top:1px solid rgba(0,0,0,0.06);display:flex;align-items:center;gap:6px;font-size:10px;color:var(--faint);letter-spacing:0.04em}
.side-foot i{width:5px;height:5px;border-radius:50%;background:var(--blue);display:block}

/* main */
.main{flex:1;min-width:0;overflow:auto;background:var(--app)}
.main::-webkit-scrollbar{width:4px;height:4px}
.main::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.12);border-radius:2px}
.ph{padding:32px 32px 24px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.ph h1{margin:0;font-size:24px;font-weight:400;letter-spacing:-0.3px;line-height:1.2;text-wrap:balance}
.ph p{margin:6px 0 0;font-size:13px;color:var(--mut);line-height:1.4}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:7px 12px;font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:0.78}
.btn-ghost{background:transparent;color:var(--ink2);border:1px solid rgba(0,0,0,0.15)}
.btn-dark{background:var(--ink);color:#fff;border:1px solid var(--ink)}
.toast{margin:16px 32px 0;padding:11px 16px;border-radius:8px;background:rgba(37,99,235,0.07);border:1px solid rgba(37,99,235,0.22);color:#1e40af;font-size:13px;display:flex;align-items:center;gap:10px;animation:gin .35s ease both}
@keyframes gin{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pad{padding:24px 32px 32px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px}
.clip{overflow:hidden}
.card-h{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.card-t{font-size:13px;font-weight:500;color:rgba(0,0,0,0.65)}
.lbl{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:0.1em;font-weight:500}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.metric{padding:20px 22px}
.metric .v{font-size:26px;font-weight:300;margin-top:12px;letter-spacing:-0.5px;line-height:1}
.metric .s{font-size:12px;color:var(--mut);margin-top:6px}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.tick{font-size:11px;font-weight:600;background:rgba(37,99,235,0.08);color:var(--blue);border-radius:5px;padding:2px 8px;white-space:nowrap}
.pill{font-size:10px;font-weight:600;letter-spacing:0.04em;padding:3px 8px;border-radius:20px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.tscroll{overflow-x:auto}
.tr{display:grid;gap:12px;padding:11px 20px;border-bottom:1px solid var(--line2);align-items:center;font-size:12.5px}
.tr.hd{padding:10px 20px;background:var(--thead);border-bottom:1px solid rgba(0,0,0,0.06);font-size:10px;font-weight:500;color:var(--faint);letter-spacing:0.08em;text-transform:uppercase}
.tr:not(.hd):hover{background:#f9fbff}
.r{text-align:right}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--mut)}
.inp{width:100%;background:var(--field);border:1px solid rgba(0,0,0,0.08);border-radius:8px;padding:9px 12px;color:var(--ink);font-size:14px}
.gtx{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:end;padding:20px 24px}
.grb{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid rgba(0,0,0,0.06)}
.stats>div{padding:14px 22px;border-right:1px solid rgba(0,0,0,0.06)}
.stats>div:last-child{border-right:0}
.strip{padding:18px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.strip .v{font-size:22px;font-weight:600;letter-spacing:-0.3px}
.vr{width:1px;height:40px;background:rgba(0,0,0,0.06)}
.step{width:26px;height:26px;border-radius:6px;border:1px solid rgba(0,0,0,0.12);background:#fff;color:var(--ink2);display:flex;align-items:center;justify-content:center;padding:0}
.subtabs{padding:0 32px}
.chart text{fill:rgba(0,0,0,0.5);font-size:11px}

@media (max-width: 900px){
  .wrap{padding:16px;align-items:stretch}
  .app{flex-direction:column;max-height:none}
  .side{width:auto;border-right:0;border-bottom:1px solid rgba(0,0,0,0.08)}
  .lights,.menu-lbl,.side-foot{display:none}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px}
  .ctl{margin-top:0}
  .nav{flex:none;flex-direction:row;overflow-x:auto;padding:0 8px 8px;gap:2px}
  .nav-i{border-left:0!important}
  .ph{padding:20px 16px 16px;flex-wrap:wrap}
  .toast{margin:12px 16px 0}
  .pad{padding:16px}
  .subtabs{padding:0 16px}
  .g4,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats>div:nth-child(2){border-right:0}
  .stats>div:nth-child(-n+2){border-bottom:1px solid rgba(0,0,0,0.06)}
  .g21,.gtx,.grb,.g3,.gctl{grid-template-columns:minmax(0,1fr)}
  .vr{display:none}
}
@media (max-width: 480px){
  .metric .v{font-size:22px}
  .metric{padding:16px}
}
</style>

<script>
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) { this.state = Object.assign({}, this.state, typeof p === 'function' ? p(this.state) : p); scheduleRender(); }
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.INST = {
      VOO: { name: 'Vanguard S&P 500 ETF', ccy: 'USD', frac: true, broker: 'IBKR' },
      QQQ: { name: 'Invesco QQQ Trust', ccy: 'USD', frac: true, broker: 'IBKR' },
      VXUS: { name: 'Vanguard Total Intl Stock', ccy: 'USD', frac: true, broker: 'IBKR' },
      AGG: { name: 'iShares Core US Aggregate Bond', ccy: 'USD', frac: true, broker: 'IBKR' },
      EWW: { name: 'iShares MSCI Mexico ETF', ccy: 'USD', frac: true, broker: 'SCHWAB' },
      SGOV: { name: 'iShares 0-3 Month Treasury Bond ETF', ccy: 'USD', frac: true, broker: 'FIDELITY' }
    };
    this.TICKERS = ['VOO', 'QQQ', 'VXUS', 'AGG', 'EWW', 'SGOV'];
    this.BROKERS = { IBKR: 'Interactive Brokers', SCHWAB: 'Charles Schwab', FIDELITY: 'Fidelity' };
    this.BSHORT = { IBKR: 'IBKR', SCHWAB: 'Schwab', FIDELITY: 'Fidelity' };
    this.STRATS = [
      { id: 'core', name: 'Retirement Core', color: '#2563eb', kind: 'Stock Direct', goal: 'Globally diversified, held for decades', thr: 5 },
      { id: 'growth', name: 'Growth', color: '#60a5fa', kind: 'Stock Direct', goal: 'US large-cap tilt toward tech', thr: 5 },
      { id: 'reserve', name: 'Emergency Reserve', color: '#94a3b8', kind: 'Stock Direct', goal: 'Six months of expenses in short-term Treasuries', thr: 5 }
    ];
    this.TXC = {
      BUY: ['#2563eb', 'rgba(37,99,235,0.09)'], SELL: ['#dc2626', 'rgba(239,68,68,0.09)'],
      DEPOSIT: ['#1d4ed8', 'rgba(59,130,246,0.10)'], WITHDRAWAL: ['#b45309', 'rgba(245,158,11,0.12)']
    };
    var T = function (id, date, type, strat, broker, ticker, qty, px, fx, amt) {
      return { id: id, date: date, type: type, strat: strat, broker: broker, ticker: ticker, qty: qty, px: px, fx: fx, amt: amt, fresh: false };
    };
    this.nextId = 100;
    this.state = {
      tab: props.startTab || 'dashboard', ccy: 'USD', priv: false, range: 'ALL', fx: 18.4,
      prices: { VOO: 540, QQQ: 480, VXUS: 66, AGG: 99, EWW: 60.8, SGOV: 100.6 },
      moves: {},
      txns: [
        T(1, '2025-01-15', 'DEPOSIT', 'core', null, null, 0, 0, 1, 700000),
        T(2, '2025-01-16', 'BUY', 'core', 'IBKR', 'VOO', 30, 480, 17.9, 0),
        T(3, '2025-01-16', 'BUY', 'core', 'IBKR', 'VXUS', 140, 58, 17.9, 0),
        T(4, '2025-01-16', 'BUY', 'core', 'IBKR', 'AGG', 90, 96, 17.9, 0),
        T(5, '2025-01-20', 'BUY', 'core', 'SCHWAB', 'EWW', 118, 56.25, 17.9, 0),
        T(6, '2025-02-01', 'DEPOSIT', 'reserve', null, null, 0, 0, 1, 140000),
        T(7, '2025-02-03', 'BUY', 'reserve', 'FIDELITY', 'SGOV', 77, 100.4, 17.9, 0),
        T(8, '2025-03-03', 'DEPOSIT', 'growth', null, null, 0, 0, 1, 200000),
        T(9, '2025-03-04', 'BUY', 'growth', 'IBKR', 'QQQ', 20, 440, 17.9, 0),
        T(10, '2025-03-04', 'BUY', 'growth', 'IBKR', 'VOO', 4, 490, 17.9, 0),
        T(11, '2025-09-10', 'DEPOSIT', 'core', null, null, 0, 0, 1, 150000),
        T(12, '2025-09-11', 'BUY', 'core', 'SCHWAB', 'VOO', 18, 505, 18.1, 0),
        T(13, '2026-08-03', 'DEPOSIT', 'growth', null, null, 0, 0, 1, 45000)
      ],
      targets: { core: { VOO: 45, VXUS: 20, AGG: 20, EWW: 15 }, growth: { QQQ: 80, VOO: 20 }, reserve: { SGOV: 100 } },
      form: { type: 'BUY', strat: 'growth', broker: 'SCHWAB', ticker: 'VOO', qty: '2', px: '540', amt: '1500' },
      formMsg: '', formErr: false,
      rb: { strat: 'core', mode: 'DRIFT', amt: '3000', fromCash: false },
      toast: ''
    };
  }

  componentWillUnmount() { clearTimeout(this._t); }

  // ── helpers ──────────────────────────────────────────
  ymd(d) { var m = d.getMonth() + 1, dd = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd; }
  today() { return this.ymd(new Date()); }
  prettyDate(s) { var M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']; var p = s.split('-'); return M[+p[1] - 1] + ' ' + (+p[2]) + ', ' + p[0]; }
  monthLbl(s) { var M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']; var p = s.split('-'); return M[+p[1] - 1] + ' ’' + p[0].slice(2); }
  num(v, d) { return Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }
  money(mxn, opt) {
    var s = this.state; opt = opt || {};
    if (s.priv) return '••••••';
    var v = s.ccy === 'USD' ? mxn / s.fx : mxn;
    var neg = v < 0; v = Math.abs(v);
    var pre = s.ccy === 'USD' ? 'US$' : '$';
    var body;
    if (opt.compact) body = v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : v >= 1e3 ? Math.round(v / 1e3) + 'k' : Math.round(v) + '';
    else body = Math.round(v).toLocaleString('en-US');
    return (neg ? '−' : (opt.sign && v > 0.5 ? '+' : '')) + pre + body;
  }
  native(tk, px) { var usd = this.INST[tk].ccy === 'USD'; return (usd ? 'US$' : '$') + this.num(px, 2); }
  pct(x, sign) { return (sign && x > 0.005 ? '+' : x < -0.005 ? '−' : '') + Math.abs(x).toFixed(1) + '%'; }
  pos(x) { return x >= 0 ? '#047857' : '#dc2626'; }
  qtyStr(tk, q) { return this.INST[tk].frac ? this.num(q, q % 1 ? 2 : 0) : this.num(q, 0); }
  flash(msg) { var self = this; clearTimeout(this._t); this._t = setTimeout(function () { self.setState({ toast: '' }); }, 5200); return msg; }
  inAmt(v) { var n = parseFloat(String(v).replace(/[^0-9.]/g, '')) || 0; return this.state.ccy === 'USD' ? n * this.state.fx : n; }
  outAmt(mxn) { return String(Math.floor(this.state.ccy === 'USD' ? mxn / this.state.fx : mxn)); }
  sname(id) { return this.STRATS.filter(function (x) { return x.id === id; })[0]; }

  // ── engine: everything is rebuilt from the ledger ──
  calc(s) {
    var I = this.INST, fx = s.fx;
    var pm = function (tk) { return s.prices[tk] * (I[tk].ccy === 'USD' ? fx : 1); };
    var lots = {}, cash = { core: 0, growth: 0, reserve: 0 }, dep = { core: 0, growth: 0, reserve: 0 };
    var sorted = s.txns.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id; });
    sorted.forEach(function (x) {
      if (x.type === 'DEPOSIT') { cash[x.strat] += x.amt; dep[x.strat] += x.amt; return; }
      if (x.type === 'WITHDRAWAL') { cash[x.strat] -= x.amt; dep[x.strat] -= x.amt; return; }
      var k = x.strat + '|' + x.ticker + '|' + x.broker;
      var L = lots[k] || (lots[k] = { strat: x.strat, ticker: x.ticker, broker: x.broker, qty: 0, cost: 0 });
      var gross = x.qty * x.px * (I[x.ticker].ccy === 'USD' ? x.fx : 1);
      if (x.type === 'BUY') { L.qty += x.qty; L.cost += gross; cash[x.strat] -= gross; }
      else { var avg = L.qty > 0 ? L.cost / L.qty : 0; var q = Math.min(x.qty, L.qty); L.cost -= avg * q; L.qty -= q; cash[x.strat] += gross; }
    });
    var pos = [];
    Object.keys(lots).forEach(function (k) { var L = lots[k]; if (L.qty > 1e-6) pos.push({ strat: L.strat, ticker: L.ticker, broker: L.broker, qty: L.qty, cost: L.cost, value: L.qty * pm(L.ticker) }); });
    var strats = this.STRATS.map(function (st) {
      var P = pos.filter(function (p) { return p.strat === st.id; });
      var H = 0, cost = 0; P.forEach(function (p) { H += p.value; cost += p.cost; });
      var tg = s.targets[st.id], tks = Object.keys(tg);
      P.forEach(function (p) { if (tks.indexOf(p.ticker) < 0) tks.push(p.ticker); });
      var rows = tks.map(function (tk) {
        var v = 0, br = [];
        P.forEach(function (p) { if (p.ticker === tk) { v += p.value; if (br.indexOf(p.broker) < 0) br.push(p.broker); } });
        var cur = H > 0 ? v / H * 100 : 0, t = tg[tk] || 0;
        return { tk: tk, v: v, cur: cur, tgt: t, drift: cur - t, brokers: br };
      });
      var maxDrift = 0; rows.forEach(function (r) { if (Math.abs(r.drift) > Math.abs(maxDrift)) maxDrift = r.drift; });
      var tsum = 0; Object.keys(tg).forEach(function (k) { tsum += tg[k]; });
      var brokers = []; P.forEach(function (p) { if (brokers.indexOf(p.broker) < 0) brokers.push(p.broker); });
      return { id: st.id, name: st.name, color: st.color, kind: st.kind, goal: st.goal, thr: st.thr, H: H, cost: cost, cash: cash[st.id], total: H + cash[st.id], dep: dep[st.id], rows: rows, maxDrift: maxDrift, drifted: Math.abs(maxDrift) > st.thr, tsum: tsum, brokers: brokers, pos: P };
    });
    var t = { total: 0, dep: 0, H: 0, cost: 0, cash: 0 };
    strats.forEach(function (x) { t.total += x.total; t.dep += x.dep; t.H += x.H; t.cost += x.cost; t.cash += x.cash; });
    return { pm: pm, pos: pos, strats: strats, total: t.total, dep: t.dep, H: t.H, cost: t.cost, cash: t.cash };
  }

  plan(s, c) {
    var rb = s.rb, I = this.INST;
    var S = c.strats.filter(function (x) { return x.id === rb.strat; })[0];
    var tg = s.targets[rb.strat];
    var A = Math.max(0, this.inAmt(rb.amt));
    var H = S.H, vals = {}, tks = S.rows.map(function (r) { vals[r.tk] = r.v; return r.tk; }), raw = {};
    if (rb.mode === 'DEPOSIT') {
      var N = H + A, sum = 0, need = {};
      tks.forEach(function (tk) { need[tk] = Math.max(0, (tg[tk] || 0) / 100 * N - vals[tk]); sum += need[tk]; });
      tks.forEach(function (tk) { raw[tk] = sum > 0 ? need[tk] * A / sum : A * (tg[tk] || 0) / 100; });
    } else if (rb.mode === 'WITHDRAWAL') {
      A = Math.min(A, H);
      var N2 = H - A, sum2 = 0, exc = {};
      tks.forEach(function (tk) { exc[tk] = Math.max(0, vals[tk] - (tg[tk] || 0) / 100 * N2); sum2 += exc[tk]; });
      tks.forEach(function (tk) { raw[tk] = -(sum2 > 0 ? exc[tk] * A / sum2 : 0); });
    } else {
      tks.forEach(function (tk) { var d = (tg[tk] || 0) / 100 * H - vals[tk]; raw[tk] = Math.abs(d) > H * 0.004 ? d : 0; });
    }
    var orders = [];
    tks.forEach(function (tk) {
      var amt = raw[tk]; if (!amt) return;
      var p = c.pm(tk), q = Math.abs(amt) / p;
      q = I[tk].frac ? Math.floor(q * 100) / 100 : Math.floor(q);
      if (q <= 0) return;

      var inv = 0; flows.forEach(function (x) { if (x.date <= ds) inv += x.type === 'DEPOSIT' ? x.amt : -x.amt; });
      var f = n > 1 ? i / (n - 1) : 1;
      var noise = (0.03 * Math.sin(i * 0.55) + 0.017 * Math.sin(i * 1.7 + 1)) * Math.min(1, (1 - f) * 6);

    var xi = function (k) { return pts[Math.min(n - 1, Math.round((n - 1) * k))].date; };

    var err = function (m) { this.setState({ formMsg: m, formErr: true }); }.bind(this);
    var tx = { id: this.nextId++, date: this.today(), type: f.type, strat: f.strat, broker: null, ticker: null, qty: 0, px: 0, fx: s.fx, amt: 0, fresh: true };
    var msg;
    if (f.type === 'DEPOSIT' || f.type === 'WITHDRAWAL') {
      var a = this.inAmt(f.amt);
      if (!(a > 0)) return err('Enter an amount greater than zero.');
      if (f.type === 'WITHDRAWAL' && a > S.cash + 0.5) return err(S.name + ' only has ' + this.money(S.cash) + ' in cash. Sell something first (Rebalance → Need liquidity).');
      tx.amt = a;
      msg = (f.type === 'DEPOSIT' ? 'Deposited ' : 'Withdrew ') + this.money(a) + (f.type === 'DEPOSIT' ? ' into ' : ' from ') + S.name + '.';

        return { side: o.side, tk: o.tk === 'SGOV' ? 'SGOV' : o.tk, broker: self.BROKERS[o.broker], qty: self.qtyStr(o.tk, o.qty), px: self.native(o.tk, s.prices[o.tk]), amt: self.money(o.amt), fg: o.side === 'BUY' ? '#2563eb' : '#dc2626', bg: o.side === 'BUY' ? 'rgba(37,99,235,0.09)' : 'rgba(239,68,68,0.08)' };
      }),
      rows: pl.rows.map(function (r) {
        return { tk: r.tk === 'SGOV' ? 'SGOV' : r.tk, before: r.before.toFixed(1) + '%', after: r.after.toFixed(1) + '%', tgt: r.tgt + '%', bw: Math.min(100, r.before).toFixed(1) + '%', aw: Math.min(100, r.after).toFixed(1) + '%', tl: 'calc(' + Math.min(100, r.tgt).toFixed(1) + '% - 1px)' };
      })
    };

    // brokers tab
    var brokers = [];
    ['IBKR', 'SCHWAB', 'FIDELITY'].forEach(function (b) {
      var P = c.pos.filter(function (p) { return p.broker === b; }).sort(function (a, b2) { return b2.value - a.value; });
      var v = 0, cost = 0; P.forEach(function (p) { v += p.value; cost += p.cost; });
      brokers.push({
        name: self.BROKERS[b], count: P.length + ' position' + (P.length === 1 ? '' : 's'), value: self.money(v),
        pnl: self.money(v - cost, { sign: true }) + ' · ' + self.pct(cost > 0 ? (v / cost - 1) * 100 : 0, true) + ' unrealized', pnlFg: self.pos(v - cost),
        rows: P.map(function (p) { var st = self.sname(p.strat); return { tk: p.ticker === 'SGOV' ? 'SGOV' : p.ticker, qty: self.qtyStr(p.ticker, p.qty) + ' sh', strat: st.name, color: st.color, value: self.money(p.value) }; })
      });
    });

    var toCcy = function (c) {
      if (s.ccy === c) return;
      var conv = function (v) { var n = pf(v); if (!n) return v; return String(Math.floor(c === 'USD' ? n / s.fx : n * s.fx)); };
      self.setState({ ccy: c, form: Object.assign({}, s.form, { amt: conv(s.form.amt) }), rb: Object.assign({}, s.rb, { amt: conv(s.rb.amt) }) });
    };
    return {
      steps: steps,
      startTour: function () { self.setState({ tab: 'transactions' }); },
      nav: { dash: navItem('dashboard'), strat: navItem('strategies'), tx: navItem('transactions'), rb: navItem('rebalance'), br: navItem('brokers') },
      isDash: s.tab === 'dashboard', isStrat: s.tab === 'strategies', isTx: s.tab === 'transactions', isRb: s.tab === 'rebalance', isBr: s.tab === 'brokers',
      ccyM: seg(s.ccy === 'MXN'), ccyU: seg(s.ccy === 'USD'),
      setMXN: function () { toCcy('MXN'); }, setUSD: function () { toCcy('USD'); }, ccyCode: s.ccy,
      priv: s.priv, notPriv: !s.priv,
      privBtn: { bg: s.priv ? 'rgba(37,99,235,0.12)' : '#f0f4f8', fg: s.priv ? '#2563eb' : 'rgba(0,0,0,0.5)' },
      togglePriv: function () { self.setState({ priv: !s.priv }); },
      page: { title: titles[s.tab][0], sub: titles[s.tab][1] },
      hasToast: !!s.toast, toast: s.toast,
      simDay: function () { self.simulate('day'); }, simRally: function () { self.simulate('rally'); },
      m: m, actions: actions, hasActions: actions.length > 0, noActions: actions.length === 0, actionCount: actions.length,
      chart: this.chart(pts), ranges: ranges, donut: donut, holdings: holdings,
      fxNote: 'USD/MXN ' + s.fx.toFixed(2) + ' · values in ' + s.ccy,
      stratCards: stratCards,
      form: f, types: types, fset: { strat: fsetter('strat'), ticker: fsetter('ticker'), broker: fsetter('broker'), qty: fsetter('qty'), px: fsetter('px'), amt: fsetter('amt') },
      formIsTrade: isTrade, formIsCash: !isTrade, pxLabel: 'Price (' + I[f.ticker].ccy + ')',
      formPreview: preview, addTxn: function () { self.addTxn(); },
      hasFormMsg: !!s.formMsg, formMsg: s.formMsg, formMsgFg: s.formErr ? '#dc2626' : '#047857',
      ledger: ledger, ledgerCount: s.txns.length + ' entries · newest first',
      rb: rb, rset: { strat: rsetter('strat'), mode: rsetter('mode'), amt: rsetter('amt') },
      rbShowAmt: rb.mode !== 'DRIFT', rbIsDrift: rb.mode === 'DRIFT',
      rbAmtLabel: rb.mode === 'DEPOSIT' ? (rb.fromCash ? 'Amount (' + s.ccy + ') · from uninvested cash' : 'Amount to invest (' + s.ccy + ')') : 'Amount you need (' + s.ccy + ')',
      rbCash: { show: showCash, title: this.money(RS.cash) + ' on cash in ' + RS.name, cta: 'Deploy ' + this.money(RS.cash), go: function () { self.setState({ rb: { strat: RS.id, mode: 'DEPOSIT', amt: self.outAmt(RS.cash), fromCash: true } }); } },
      plan: planV, execute: function () { self.execute(); },
      brokers: brokers
    };
  }
}

      '</svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><div class="lbl">3 strategies</div><div class="num" style="font-size:16px;letter-spacing:-0.3px">' + e(d.center) + '</div></div></div><div style="display:flex;flex-direction:column;gap:8px;padding:0 8px">' +
      d.legend.map(function (l) { return '<div style="display:flex;align-items:center;gap:8px;font-size:12px"><span class="dot" style="background:' + l.color + '"></span><span style="flex:1;color:rgba(0,0,0,0.65)">' + e(l.name) + '</span><span class="num">' + l.pct + '</span></div>'; }).join('') + '</div></div></div>';
    var cols = 'grid-template-columns:2fr 1.4fr 0.8fr 0.9fr 0.7fr 1fr 0.8fr;min-width:720px';
    out += '<div class="card clip"><div class="card-h"><div class="card-t">Holdings · consolidated across brokers</div><div style="font-size:11px;color:var(--faint)">' + e(v.fxNote) + '</div></div><div class="tscroll"><div class="tr hd" style="' + cols + '"><div>Instrument</div><div>Held at</div><div class="r">Qty</div><div class="r">Price</div><div class="r">Move</div><div class="r">Value</div><div class="r">P&amp;L</div></div>' +
      v.holdings.map(function (h) { return '<div class="tr num" style="' + cols + '"><div style="display:flex;align-items:center;gap:10px;min-width:0"><span class="tick">' + h.tk + '</span><span style="color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + e(h.name) + '</span></div><div style="color:rgba(0,0,0,0.6);font-size:12px">' + e(h.brokers) + '</div><div class="r" style="color:var(--ink2)">' + h.qty + '</div><div class="r" style="color:var(--ink2)">' + h.px + '</div><div class="r" style="color:' + h.moveFg + '">' + h.move + '</div><div class="r" style="font-weight:600">' + e(h.value) + '</div><div class="r" style="color:' + h.pnlFg + '">' + h.pnl + '</div></div>'; }).join('') +
      '</div></div></div>';
    return out;
  }

  function strategies(v) {
    var cols = 'grid-template-columns:1.1fr 1.3fr 2.2fr 0.7fr 1.1fr 0.7fr;min-width:680px;padding:9px 22px';
    return '<div class="pad">' + v.stratCards.map(function (sc) {
      return '<div class="card clip" style="border-radius:10px"><div style="padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid rgba(0,0,0,0.06)"><div style="display:flex;align-items:center;gap:12px;min-width:0"><span class="dot" style="width:10px;height:10px;background:' + sc.color + '"></span><div style="display:flex;flex-direction:column;gap:3px"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:16px;font-weight:500">' + e(sc.name) + '</span><span style="font-size:10px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--field);color:rgba(0,0,0,0.6)">' + e(sc.kind) + '</span></div><div style="font-size:12px;color:var(--mut)">' + e(sc.goal) + '</div></div></div>' +
        '<div style="display:flex;align-items:center;gap:10px"><span class="pill" style="font-size:11px;padding:4px 10px;background:' + sc.badgeBg + ';color:' + sc.badgeFg + '">' + e(sc.badge) + '</span><button class="btn btn-ghost" data-click="' + on(sc.rebalance) + '">Rebalance →</button></div></div>' +
        '<div class="stats"><div><div class="lbl" style="letter-spacing:0.08em">Invested value</div><div class="num" style="font-size:18px;font-weight:300;margin-top:6px">' + e(sc.value) + '</div></div><div><div class="lbl" style="letter-spacing:0.08em">Unrealized P&amp;L</div><div class="num" style="font-size:18px;font-weight:300;margin-top:6px;color:' + sc.pnlFg + '">' + e(sc.pnl) + '</div></div><div><div class="lbl" style="letter-spacing:0.08em">Uninvested cash</div><div class="num" style="font-size:18px;font-weight:300;margin-top:6px">' + e(sc.cash) + '</div></div><div><div class="lbl" style="letter-spacing:0.08em">Held across</div><div style="font-size:13px;margin-top:8px;color:#1e3a8a">' + e(sc.brokers) + '</div></div></div>' +
        '<div class="tscroll"><div class="tr hd" style="' + cols + '"><div>Instrument</div><div>Broker</div><div>Current vs target</div><div class="r">Current</div><div style="text-align:center">Target</div><div class="r">Drift</div></div>' +
        sc.rows.map(function (r) {
          return '<div class="tr num" style="' + cols + '"><div><span class="tick">' + r.tk + '</span></div><div style="font-size:12px;color:rgba(0,0,0,0.6)">' + e(r.brokers) + '</div><div style="position:relative;height:10px;border-radius:5px;background:var(--field)"><div style="position:absolute;left:0;top:0;bottom:0;border-radius:5px;width:' + r.barW + ';background:' + r.barC + ';transition:width .45s ease"></div><div style="position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:#0f172a;left:' + r.tgtL + '"></div></div><div class="r">' + r.cur + '</div>' +
            '<div style="display:flex;align-items:center;justify-content:center;gap:6px"><button class="step" aria-label="Lower ' + r.tk + ' target" data-click="' + on(r.dec) + '">' + ic('minus', 12) + '</button><span style="min-width:36px;text-align:center;font-weight:600;color:#1e3a8a">' + r.tgt + '</span><button class="step" aria-label="Raise ' + r.tk + ' target" data-click="' + on(r.inc) + '">' + ic('plus', 12) + '</button></div><div class="r" style="color:' + r.driftFg + ';font-weight:500">' + r.drift + '</div></div>';
        }).join('') + '</div><div style="padding:11px 22px;font-size:12px;color:' + sc.sumFg + ';display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><span>' + e(sc.sumText) + '</span><span style="color:var(--faint)">Drift threshold ±' + sc.thr + '</span></div></div>';
    }).join('') + '</div>';
  }

  function transactions(v) {
    var f = v.form;
    var form = '<form class="card" id="g-txform" style="padding:20px;display:flex;flex-direction:column;gap:14px" novalidate><div style="font-size:13px;font-weight:500">Record a transaction</div>' +
      '<div role="group" aria-label="Transaction type" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;background:var(--field);border-radius:8px;padding:3px">' +
      v.types.map(function (t) { return '<button type="button" data-click="' + on(t.pick) + '" style="padding:6px 0;border-radius:6px;border:none;font-size:10.5px;font-weight:700;letter-spacing:0.04em;background:' + t.bg + ';color:' + t.fg + '">' + t.label + '</button>'; }).join('') + '</div>' +
      '<div class="field"><label for="g-f-strat">Strategy</label><select class="inp" id="g-f-strat" data-change="' + on(v.fset.strat) + '">' + opts(STRAT_OPTS, f.strat) + '</select></div>';
    if (v.formIsTrade) {
      form += '<div class="g2"><div class="field"><label for="g-f-tk">Ticker</label><select class="inp" id="g-f-tk" data-change="' + on(v.fset.ticker) + '">' + opts([['VOO', 'VOO'], ['QQQ', 'QQQ'], ['VXUS', 'VXUS'], ['AGG', 'AGG'], ['EWW', 'EWW'], ['SGOV', 'SGOV']], f.ticker) + '</select></div>' +
        '<div class="field"><label for="g-f-br">Broker</label><select class="inp" id="g-f-br" data-change="' + on(v.fset.broker) + '">' + opts([['IBKR', 'Interactive Brokers'], ['SCHWAB', 'Charles Schwab'], ['FIDELITY', 'Fidelity']], f.broker) + '</select></div></div>' +
        '<div class="g2"><div class="field"><label for="g-f-q">Quantity</label><input class="inp" id="g-f-q" type="text" inputmode="decimal" value="' + e(f.qty) + '" data-input="' + on(v.fset.qty) + '"></div>' +
        '<div class="field"><label for="g-f-px">' + e(v.pxLabel) + '</label><input class="inp" id="g-f-px" type="text" inputmode="decimal" value="' + e(f.px) + '" data-input="' + on(v.fset.px) + '"></div></div>';
    } else {
      form += '<div class="field"><label for="g-f-amt">Amount (' + v.ccyCode + ')</label><input class="inp" id="g-f-amt" type="text" inputmode="decimal" value="' + e(f.amt) + '" data-input="' + on(v.fset.amt) + '"></div>';
    }
    form += '<div style="font-size:12px;color:rgba(0,0,0,0.6);background:#f8fafc;border:1px dashed rgba(37,99,235,0.25);border-radius:8px;padding:10px 12px;line-height:1.5">' + e(v.formPreview) + '</div>' +
      '<button type="submit" class="btn btn-dark" style="height:40px;font-size:12px">' + ic('plus', 13) + 'Add transaction</button>' +
      (v.hasFormMsg ? '<div role="status" style="font-size:12px;line-height:1.5;color:' + v.formMsgFg + '">' + e(v.formMsg) + '</div>' : '') +
      '<div style="font-size:11.5px;line-height:1.55;color:var(--mut);border-top:1px solid rgba(0,0,0,0.06);padding-top:12px">Try buying VOO for Growth at Schwab. Retirement Core already holds VOO there, and Gael keeps each strategy’s shares and cost basis separate.</div></form>';
    SUBMIT = v.addTxn;
    var cols = 'grid-template-columns:0.95fr 0.9fr 1.3fr 0.7fr 0.9fr 0.7fr 0.9fr 1fr;gap:10px;min-width:700px';
    var led = '<div class="card clip"><div class="card-h"><div class="card-t">Ledger · append-only</div><div style="font-size:11px;color:var(--faint)">' + e(v.ledgerCount) + '</div></div><div class="tscroll"><div class="tr hd" style="' + cols + '"><div>Date</div><div>Type</div><div>Strategy</div><div>Broker</div><div>Ticker</div><div class="r">Qty</div><div class="r">Price</div><div class="r">Total</div></div>' +
      v.ledger.map(function (t) { return '<div class="tr num" style="' + cols + ';font-size:12px;background:' + t.rowBg + '"><div style="color:rgba(0,0,0,0.6)">' + t.date + '</div><div><span class="pill" style="background:' + t.bg + ';color:' + t.fg + '">' + t.type + '</span></div><div style="display:flex;align-items:center;gap:6px;min-width:0"><span class="dot" style="width:6px;height:6px;background:' + t.color + '"></span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + e(t.strat) + '</span></div><div style="color:rgba(0,0,0,0.6)">' + t.broker + '</div><div style="font-weight:600">' + t.ticker + '</div><div class="r" style="color:var(--ink2)">' + t.qty + '</div><div class="r" style="color:rgba(0,0,0,0.6)">' + t.px + '</div><div class="r" style="font-weight:600">' + e(t.total) + '</div></div>'; }).join('') + '</div></div>';
    return '<div class="pad"><div class="gtx">' + form + led + '</div></div>';
  }

  function rebalance(v) {
    var rb = v.rb, p = v.plan;
    var out = '<div class="subtabs" style="display:flex;border-bottom:1px solid var(--line);background:#fff"><div style="padding:12px 18px;border-bottom:2px solid var(--blue);color:var(--blue);font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px">' + ic('rb', 13) + 'Per strategy</div></div><div class="pad">' +
      '<div class="card gctl"><div class="field"><label for="g-r-s">Strategy</label><select class="inp" id="g-r-s" data-change="' + on(v.rset.strat) + '">' + opts(STRAT_OPTS, rb.strat) + '</select></div>' +
      '<div class="field"><label for="g-r-m">Action</label><select class="inp" id="g-r-m" data-change="' + on(v.rset.mode) + '">' + opts([['DEPOSIT', 'Deposit (Buy)'], ['WITHDRAWAL', 'Need liquidity (Sell)'], ['DRIFT', 'Check drift']], rb.mode) + '</select></div>' +
      (v.rbShowAmt ? '<div class="field"><label for="g-r-a">' + e(v.rbAmtLabel) + '</label><input class="inp" id="g-r-a" type="text" inputmode="decimal" value="' + e(rb.amt) + '" data-input="' + on(v.rset.amt) + '"></div>'
        : '<div style="font-size:12px;line-height:1.5;color:var(--mut);padding-bottom:4px">Compares current weights to your targets. Sales inside the strategy pay for the buys.</div>') + '</div>';
    if (v.rbCash.show) out += '<div style="background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.35);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">' + ic('wallet', 20, '#d97706') + '<div style="flex:1;min-width:200px"><div style="font-size:14px;font-weight:700;color:var(--amber);margin-bottom:2px">' + e(v.rbCash.title) + '</div><div style="font-size:12px;color:#92400e">Gael can invest it in the positions that are below target.</div></div><button class="btn" data-click="' + on(v.rbCash.go) + '" style="padding:8px 16px;font-size:12px;background:var(--amber);color:#fff;border:1px solid var(--amber)">' + e(v.rbCash.cta) + '</button></div>';
    var st = function (l, val, col) { return '<div><div class="lbl" style="letter-spacing:0.08em;margin-bottom:4px">' + l + '</div><div class="v num" style="color:' + (col || 'var(--ink)') + '">' + val + '</div></div>'; };
    out += '<div class="card strip" style="border-radius:10px">' + st('Orders', p.count) + '<div class="vr"></div>' + st('Total buys', e(p.buys), 'var(--blue)') + '<div class="vr"></div>' + st('Total sells', e(p.sells)) + '<div class="vr"></div>' +
      st('Max drift', '<span style="color:' + p.beforeFg + '">' + p.before + '</span> <span style="font-size:14px;color:rgba(0,0,0,0.4)">→</span> <span style="color:var(--green)">' + p.after + '</span>') + '</div>';
    var cols = 'grid-template-columns:0.7fr 0.9fr 1.2fr 0.8fr 0.9fr 1fr;gap:10px;min-width:450px';
    var orders = '<div class="card clip" style="border-radius:10px"><div class="card-h" style="font-size:13px;color:rgba(0,0,0,0.6)">' + e(p.headline) + '</div>';
    if (p.empty) orders += '<div style="padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center">' + ic('check', 22, '#047857') + '<div style="font-size:14px;font-weight:500">Nothing to trade</div><div style="font-size:12.5px;color:var(--mut)">' + e(p.emptyText) + '</div></div>';
    else orders += '<div class="tscroll"><div class="tr hd" style="' + cols + '"><div>Action</div><div>Ticker</div><div>Broker</div><div class="r">Qty</div><div class="r">Price</div><div class="r">Amount</div></div>' +
      p.orders.map(function (o) { return '<div class="tr num" style="' + cols + ';padding:12px 20px"><div><span class="pill" style="font-weight:700;letter-spacing:0.06em;padding:3px 9px;background:' + o.bg + ';color:' + o.fg + '">' + o.side + '</span></div><div><span class="tick">' + o.tk + '</span></div><div style="color:rgba(0,0,0,0.65);font-size:12px">' + e(o.broker) + '</div><div class="r" style="color:var(--ink2)">' + o.qty + '</div><div class="r" style="color:var(--mut)">' + o.px + '</div><div class="r" style="font-weight:700">' + e(o.amt) + '</div></div>'; }).join('') +
      '</div><div style="padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div style="font-size:11.5px;line-height:1.5;color:var(--mut);max-width:300px">Gael never trades for you. Place these at your broker, then record them here.</div><button class="btn btn-dark" data-click="' + on(v.execute) + '" style="padding:9px 16px;font-size:12px">' + e(p.cta) + '</button></div>';
    orders += '</div>';
    var weights = '<div class="card" style="border-radius:10px;padding:16px 20px;display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div class="card-t">Weights after these orders</div><div style="display:flex;gap:10px;font-size:10.5px;color:var(--mut)"><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:6px;border-radius:2px;background:#bfdbfe"></span>Now</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:6px;border-radius:2px;background:var(--blue)"></span>After</span><span style="display:flex;align-items:center;gap:4px"><span style="width:2px;height:10px;background:#0f172a"></span>Target</span></div></div>' +
      p.rows.map(function (w) { return '<div style="display:flex;flex-direction:column;gap:6px"><div class="num" style="display:flex;justify-content:space-between;gap:8px;font-size:12px"><span style="font-weight:600">' + w.tk + '</span><span style="color:var(--mut)">' + w.before + ' → <strong style="color:#1e3a8a;font-weight:600">' + w.after + '</strong> · target ' + w.tgt + '</span></div><div style="position:relative;height:14px"><div style="position:absolute;left:0;top:0;height:6px;border-radius:3px;background:#bfdbfe;width:' + w.bw + ';transition:width .4s ease"></div><div style="position:absolute;left:0;top:8px;height:6px;border-radius:3px;background:var(--blue);width:' + w.aw + ';transition:width .4s ease"></div><div style="position:absolute;top:-2px;bottom:-2px;width:2px;background:#0f172a;border-radius:1px;left:' + w.tl + '"></div></div></div>'; }).join('') + '</div>';
    return out + '<div class="grb">' + orders + weights + '</div></div>';
  }

  function brokers(v) {
    return '<div class="pad"><div style="background:rgba(37,99,235,0.05);border:1px solid rgba(37,99,235,0.18);border-radius:8px;padding:14px 18px;font-size:13px;line-height:1.55;color:#1e3a8a">Each card lists what a broker holds and which strategy owns it. VOO, for example, is split across two strategies and two brokers, and Gael tracks each part with its own cost basis.</div><div class="g3">' +
      v.brokers.map(function (b) {
        return '<div class="card clip" style="border-radius:10px"><div style="padding:18px 20px;border-bottom:1px solid rgba(0,0,0,0.06)"><div style="display:flex;align-items:center;gap:10px"><div style="width:30px;height:30px;border-radius:8px;background:#eff6ff;color:var(--blue);display:flex;align-items:center;justify-content:center">' + ic('br', 15) + '</div><div><div style="font-size:14px;font-weight:500">' + e(b.name) + '</div><div style="font-size:11px;color:var(--faint)">' + b.count + '</div></div></div><div class="num" style="font-size:24px;font-weight:300;letter-spacing:-0.5px;margin-top:14px">' + e(b.value) + '</div><div style="font-size:12px;margin-top:4px;color:' + b.pnlFg + '">' + e(b.pnl) + '</div></div>' +
          b.rows.map(function (p) { return '<div class="num" style="padding:10px 20px;border-bottom:1px solid rgba(0,0,0,0.04);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px"><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span style="font-weight:600">' + p.tk + ' <span style="font-weight:400;color:var(--faint)">· ' + p.qty + '</span></span><span style="display:flex;align-items:center;gap:5px;color:rgba(0,0,0,0.6);font-size:11px"><span class="dot" style="width:6px;height:6px;background:' + p.color + '"></span>' + e(p.strat) + '</span></div><div class="r">' + e(p.value) + '</div></div>'; }).join('') + '</div>';
      }).join('') + '</div></div>';
  }

  var root = document.getElementById('app');
  var comp = new Component({ startTab: (location.hash || '').replace('#', '') || 'dashboard' });
  var SUBMIT = null, pending = false, lastTab = null;

  function render() {
    pending = false;
    H = []; SUBMIT = null;
    var v = comp.renderVals();
    var main = document.getElementById('gmain');
    var scroll = main ? main.scrollTop : 0;
    var ae = document.activeElement, focusId = ae && root.contains(ae) ? ae.id : null, sel = null;
    if (focusId && ae.tagName === 'INPUT') sel = [ae.selectionStart, ae.selectionEnd];
    var tab = v.isDash ? dashboard(v) : v.isStrat ? strategies(v) : v.isTx ? transactions(v) : v.isRb ? rebalance(v) : brokers(v);
    root.innerHTML = sidebar(v) + '<main class="main" id="gmain">' + header(v) + tab + '</main>';
    var nm = document.getElementById('gmain');
    nm.scrollTop = comp.state.tab === lastTab ? scroll : 0;
    if (comp.state.tab !== lastTab) { var cur = root.querySelector('.nav-i[aria-current]'); if (cur && cur.parentNode.scrollWidth > cur.parentNode.clientWidth) cur.parentNode.scrollLeft = cur.offsetLeft - 8; }
    lastTab = comp.state.tab;
    if (focusId) { var el = document.getElementById(focusId); if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (x) {} } }
  }
  window.scheduleRender = function () { if (!pending) { pending = true; Promise.resolve().then(render); } };

  root.addEventListener('click', function (ev) { var t = ev.target.closest('[data-click]'); if (t && root.contains(t)) { ev.preventDefault(); var fn = H[+t.getAttribute('data-click')]; if (fn) fn(ev); } });
  root.addEventListener('change', function (ev) { var t = ev.target; if (t.hasAttribute('data-change')) { var fn = H[+t.getAttribute('data-change')]; if (fn) fn({ target: t }); } });
  root.addEventListener('input', function (ev) { var t = ev.target; if (t.hasAttribute('data-input')) { var fn = H[+t.getAttribute('data-input')]; if (fn) fn({ target: t }); } });
  root.addEventListener('submit', function (ev) { ev.preventDefault(); if (SUBMIT) SUBMIT(); });
  render();
})();
</script>

</body></html>
